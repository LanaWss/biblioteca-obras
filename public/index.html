<!doctype html>
<html>
  <head>
    <title>Biblioteca de Obras</title>
    <link rel="stylesheet" href="style.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    />
    <link rel="icon" href="icone.png" />
  </head>
  <body>
    <div id="boas-vindas" class="boas-vindas" hidden>
      <p>Olá, <strong id="nome-boas-vindas"></strong></p>
    </div>
    <header>
      <h1>Minhas Obras</h1>
      <p>Esta é a página principal da sua biblioteca de obras.</p>

      <div class="barra-ferramentas">
        <label class="campo-busca" for="buscar-obras">
          <span class="icone-busca">🔍</span>
          <input
            id="buscar-obras"
            type="search"
            placeholder="Buscar obra pelo nome"
            autocomplete="off"
          />
        </label>
        <button id="abrir-filtros" type="button">
          <i class="fa-solid fa-filter"></i> Filtro
        </button>

        <button id="botao-criar" type="button">
          <i class="fa-solid fa-plus"></i> Criar obra
        </button>

        <button id="botao-sair">Sair</button>
      </div>

      <div id="popup-filtros">
        <div class="popup-shell">
          <button id="fechar-filtros" class="popup-fechar" type="button">X</button>
          <div>
          <h2>Filtros</h2>
          <label for="filtro-tipo">Tipo</label>
          <select id="filtro-tipo">
            <option value="">Todos</option>
            <option value="anime">Anime</option>
            <option value="manga">Mangá</option>
          </select>

          <label for="filtro-status">Status</label>
          <select id="filtro-status">
            <option value="">Todos</option>
            <option value="completa">Completa</option>
            <option value="hiato">Em hiato</option>
            <option value="lancando">Lançando</option>
          </select>

          <label for="filtro-progresso">Progresso</label>
          <select id="filtro-progresso">
            <option value="">Todos</option>
            <option value="pendente">Falta ler</option>
            <option value="completo">Leu tudo</option>
          </select>

          <button id="limpar-filtros" type="button">Limpar filtros</button>
          </div>
        </div>
      </div>

      <div id="popup-criar">
        <div class="popup-shell">
          <button id="fechar-popup" class="popup-fechar" type="button">X</button>
          <div>
          <h2>Criar obra</h2>

          <form id="form-criar" autocomplete="off">
            <label for="titulo-obra">Nome: </label>

            <input
              id="titulo-obra"
              type="text"
              placeholder="Nome da obra"
              required
            />

            <label for="tipo-obra">Tipo</label>

            <select id="tipo-obra" required>
              <option value="">Selecione</option>
              <option value="anime">Anime</option>
              <option value="manga">Mangá</option>
            </select>

            <div id="campos-anime" style="display: none">
              <div id="lista-temporadas">
                <div class="temporada">
                  <label>
                    Temporada
                    <input type="number" value="1" min="1" />
                  </label>
                  <label>
                    Episódios
                    <input type="number" min="1" />
                  </label>
                  <label>
                    Começa no episódio
                    <input type="number" min="1" value="1" />
                  </label>
                </div>
              </div>

              <p class="aviso-form">Preencha a temporada e clique em Enviar temporada para cadastrar a próxima.</p>

              <button type="button" id="adicionar-temporada">
                + Enviar temporada
              </button>
            </div>

            <div id="campos-manga" style="display: none">
              <div id="lista-volumes">
                <div class="volume">
                  <label>
                    Volume
                    <input type="number" value="1" min="1" />
                  </label>

                  <label>
                    Começa no capítulo
                    <input type="number" value="1" min="1" />
                  </label>

                  <label>
                    Termina no capítulo
                    <input type="number" min="1" />
                  </label>
                </div>
              </div>

              <button type="button" id="adicionar-volume">
                + Enviar volume
              </button>
            </div>

            <label for="status-obra">Status</label>

            <select id="status-obra" required>
              <option value="">Selecione</option>
              <option value="completa">Completa</option>
              <option value="hiato">Em hiato</option>
              <option value="lancando">Lançando</option>
            </select>

            <label for="imagem-obra">Imagem</label>

            <input
              id="imagem-obra"
              type="url"
              placeholder="URL da imagem (opcional)"
            />
            <label for="arquivo-imagem-obra">Ou imagem do dispositivo</label>
            <input id="arquivo-imagem-obra" type="file" accept="image/*" />
            <label for="preferencia-imagem-obra">Imagem preferida</label>
            <select id="preferencia-imagem-obra">
              <option value="url">URL</option>
              <option value="arquivo">Imagem do dispositivo</option>
            </select>
            <img id="preview-imagem" src="" alt="Preview da obra" hidden />
            <p id="aviso-imagem-obra" class="aviso-form" role="status"></p>

            <label for="link-leitura-obra">Link para ler (opcional)</label>
            <input
              id="link-leitura-obra"
              type="url"
              placeholder="https://site.com/obra"
            />

            <button type="submit">Criar</button>
          </form>
          </div>
        </div>
      </div>
    </header>

    <div id="popup-editar">
      <div class="popup-shell">
        <button id="fechar-popup-editar" class="popup-fechar" type="button">X</button>
        <div>
        <h2>Editar obra</h2>

        <form id="form-editar" autocomplete="off">
          <label for="editar-titulo">Nome:</label>
          <input id="editar-titulo" type="text" required />

          <label for="editar-tipo">Tipo</label>
          <select id="editar-tipo" required>
            <option value="">Selecione</option>
            <option value="anime">Anime</option>
            <option value="manga">Mangá</option>
          </select>

          <div id="editar-campos-anime" style="display: none">
            <div id="editar-lista-temporadas">
              <div class="temporada">
                <label>
                  Temporada
                  <input type="number" min="1" />
                </label>
                <label>
                  Episódios
                  <input type="number" min="0" />
                </label>
                <label>
                  Começa no episódio
                  <input type="number" min="1" value="1" />
                </label>
              </div>
            </div>

            <button type="button" id="editar-adicionar-temporada">
              + Enviar temporada
            </button>
          </div>

          <div id="editar-campos-manga" style="display: none">
            <div id="editar-lista-volumes">
              <div class="volume">
                <label>
                  Volume
                  <input type="number" min="1" />
                </label>
                <label>
                  Capítulos
                  <input type="number" min="0" />
                </label>
              </div>
            </div>

            <button type="button" id="editar-adicionar-volume">
                + Enviar volume
            </button>
          </div>

          <label for="editar-status">Status</label>
          <select id="editar-status" required>
            <option value="">Selecione</option>
            <option value="completa">Completa</option>
            <option value="hiato">Em hiato</option>
            <option value="lancando">Lançando</option>
          </select>

          <label for="editar-imagem">Imagem</label>
          <input
            id="editar-imagem"
            type="url"
            placeholder="URL da imagem (opcional)"
          />
          <label for="editar-arquivo-imagem">Ou imagem do dispositivo</label>
          <input id="editar-arquivo-imagem" type="file" accept="image/*" />
          <label for="editar-preferencia-imagem">Imagem preferida</label>
          <select id="editar-preferencia-imagem">
            <option value="url">URL</option>
            <option value="arquivo">Imagem do dispositivo</option>
          </select>

          <img id="preview-imagem-editar" src="" alt="Preview da obra" hidden />
          <p id="aviso-imagem-editar" class="aviso-form" role="status"></p>

          <label for="editar-link-leitura">Link para ler (opcional)</label>
          <input
            id="editar-link-leitura"
            type="url"
            placeholder="https://site.com/obra"
          />

          <button type="submit">Salvar</button>
        </form>
        </div>
      </div>
    </div>

    <div id="popup-progresso">
      <div class="popup-shell">
        <button id="fechar-popup-progresso" class="popup-fechar" type="button">X</button>
        <div>
        <h2 id="titulo-progresso"></h2>
        <button id="marcar-toda-obra" type="button"></button>
        <div id="lista-progresso"></div>
        </div>
      </div>
    </div>

    <div id="lista-obras"></div>

    <script src="script.js?v=4"></script>
  </body>
</html>
