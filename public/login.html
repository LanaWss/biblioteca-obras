<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#11253d">
    <meta name="description" content="Organize e acompanhe suas obras favoritas.">
    <link rel="manifest" href="/manifest.json">
    <link rel="apple-touch-icon" href="/icone-192.png">
    <title>Entrar | Biblioteca de Obras</title>
    <link rel="stylesheet" href="style.css">
    <script src="/pwa.js" defer></script>
</head>

<body class="pagina-login">
    <main class="login-layout">
        <section class="login-painel">
            <div class="login-cabecalho">
                <span class="login-saudacao">Bem-vindo de volta</span>
                <h2>Entrar na conta</h2>
                <p>Acesse sua biblioteca para continuar acompanhando suas obras.</p>
            </div>

            <form id="form-login" novalidate>
                <div class="campo-login">
                    <label for="email">Email</label>
                    <input
                        type="email"
                        id="email"
                        placeholder="voce@exemplo.com"
                        autocomplete="email"
                        required
                    >
                </div>

                <div class="campo-login">
                    <div class="campo-login-topo">
                        <label for="senha">Senha</label>
                        <button type="button" id="alternar-senha" class="botao-link">Mostrar</button>
                    </div>
                    <div class="campo-senha">
                        <input
                            type="password"
                            id="senha"
                            placeholder="Digite sua senha"
                            autocomplete="current-password"
                            minlength="6"
                            required
                        >
                    </div>
                </div>

                <button type="button" id="esqueci-senha" class="botao-link botao-esqueci-senha">
                    Esqueci minha senha
                </button>

                <p id="mensagem-login" class="mensagem-login" role="alert" aria-live="polite"></p>

                <button type="submit" id="botao-entrar" class="botao-entrar">
                    <span class="texto-botao">Entrar na biblioteca</span>
                    <span class="carregando-botao" aria-hidden="true"></span>
                </button>
            </form>

            <form id="form-recuperacao" class="form-cadastro" novalidate hidden>
                <div class="campo-login">
                    <label for="email-recuperacao">Email cadastrado</label>
                    <input
                        type="email"
                        id="email-recuperacao"
                        placeholder="voce@exemplo.com"
                        autocomplete="email"
                        required
                    >
                </div>
                <p class="ajuda-login">Enviaremos uma senha temporária para o email informado. Use-a para entrar e depois altere sua senha no seu perfil.</p>
                <button type="submit" id="botao-recuperar" class="botao-entrar">
                    <span class="texto-botao">Enviar senha temporária</span>
                    <span class="carregando-botao" aria-hidden="true"></span>
                </button>
                <button type="button" id="voltar-login" class="botao-alternar">Voltar para o login</button>
            </form>

            <form id="form-cadastro" class="form-cadastro" novalidate hidden>
                <div class="campo-login">
                    <label for="nome-cadastro">Nome</label>
                    <input id="nome-cadastro" type="text" placeholder="Como quer ser chamado?" autocomplete="name" required>
                </div>
                <div class="campo-login">
                    <label for="email-cadastro">Email</label>
                    <input id="email-cadastro" type="email" placeholder="voce@exemplo.com" autocomplete="email" required>
                </div>
                <div class="campo-login">
                    <label for="senha-cadastro">Senha</label>
                    <input id="senha-cadastro" type="password" placeholder="Pelo menos 6 caracteres" autocomplete="new-password" minlength="6" required>
                </div>
                <div class="campo-login">
                    <label for="confirmar-senha">Confirmar senha</label>
                    <input id="confirmar-senha" type="password" placeholder="Repita sua senha" autocomplete="new-password" minlength="6" required>
                </div>
                <label class="aceite-documentos" for="aceite-documentos">
                    <input id="aceite-documentos" type="checkbox" required>
                    <span>Li e aceito os <a href="/termos.html" target="_blank" rel="noopener noreferrer">Termos de Serviço</a> e a <a href="/privacidade.html" target="_blank" rel="noopener noreferrer">Política de Privacidade</a>.</span>
                </label>
                <button type="submit" id="botao-cadastrar" class="botao-entrar">
                    <span class="texto-botao">Criar minha conta</span>
                    <span class="carregando-botao" aria-hidden="true"></span>
                </button>
            </form>

            <button type="button" id="alternar-cadastro" class="botao-alternar">Ainda não tenho uma conta</button>

            <p class="login-rodape">
                Seu acesso é pessoal e protegido.<br>
                <a href="/termos.html">Termos de Serviço</a>
                <span aria-hidden="true">·</span>
                <a href="/privacidade.html">Política de Privacidade</a>
            </p>
        </section>
    </main>

    <script src="login.js"></script>

</body>
</html>
