<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Login</title>
</head>

<body>

    <h1>Login</h1>

    <form id="form-login">

        <input
            type="email"
            id="email"
            placeholder="Email"
            required
        >

        <input
            type="password"
            id="senha"
            placeholder="Senha"
            required
        >

        <button type="submit">Entrar</button>

    </form>

    <script src="login.js"></script>

</body>
</html>
